name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version x.y.z (no leading v)'
        required: true

permissions:
  contents: write
  # attest-build-provenance signs with a short-lived OIDC token and writes the
  # attestation back to this repository. Both are per-job, not inherited.
  id-token: write
  attestations: write

jobs:
  build-msi:
    name: build MSI + attach to release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $v = $v -replace '^v',''
          "version=$v" >> $env:GITHUB_OUTPUT
          # MSI ProductVersion must be numeric (no -rc1 / +build label) — take
          # the core before the first '-' for the WiX package version.
          "msiversion=$($v -split '-' | Select-Object -First 1)" >> $env:GITHUB_OUTPUT

      - name: Publish desktop app (self-contained win-x64)
        run: dotnet publish src/DbDelta.App.Avalonia/DbDelta.App.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o installer/staging/app

      - name: Publish CLI (self-contained win-x64)
        run: dotnet publish src/DbDelta.Cli/DbDelta.Cli.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.ver.outputs.version }} -o installer/staging/cli

      - name: Build MSI
        run: dotnet build installer/DbDelta.Installer.wixproj -c Release -p:Version=${{ steps.ver.outputs.version }} -p:MsiVersion=${{ steps.ver.outputs.msiversion }}

      - name: Smoke install / uninstall
        shell: pwsh
        run: |
          # msiexec runs server-side and needs an absolute, backslash path —
          # a CWD-relative forward-slash path fails to open (error 1619).
          $msi = (Resolve-Path "installer/bin/Release/DbDelta-${{ steps.ver.outputs.version }}-win-x64.msi").Path
          $i = Start-Process msiexec -ArgumentList "/i `"$msi`" /quiet /qn /norestart /l*v install.log" -Wait -PassThru
          if ($i.ExitCode -ne 0) { if (Test-Path install.log) { Get-Content install.log -Tail 40 }; throw "install failed (exit $($i.ExitCode))" }
          $app = Join-Path $env:ProgramFiles 'DbDelta\DbDelta.App.exe'
          $cli = Join-Path $env:ProgramFiles 'DbDelta\cli\dbdelta.exe'
          if (-not (Test-Path $app)) { throw "app missing: $app" }
          if (-not (Test-Path $cli)) { throw "cli missing: $cli" }
          $machinePath = [Environment]::GetEnvironmentVariable('PATH','Machine')
          if ($machinePath -notlike '*DbDelta\cli*') { throw "cli dir not on machine PATH" }
          $x = Start-Process msiexec -ArgumentList "/x `"$msi`" /quiet /qn /norestart" -Wait -PassThru
          if ($x.ExitCode -ne 0) { throw "uninstall failed (exit $($x.ExitCode))" }
          if (Test-Path $app) { throw "app still present after uninstall: $app" }
          Write-Host "Smoke install/uninstall OK"

      - name: SHA256 of the MSI
        id: hash
        shell: pwsh
        run: |
          # After the smoke install, and after the signing step when there is
          # one: signing rewrites the file, so a hash taken before it would
          # describe bytes nobody can download.
          $msi = "installer/bin/Release/DbDelta-${{ steps.ver.outputs.version }}-win-x64.msi"
          $h = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          # "<hash><2 spaces><bare name>" and an LF: the format `sha256sum -c`
          # reads. Set-Content would write CRLF and coreutils would not match.
          [IO.File]::WriteAllText("$msi.sha256", "$h  $(Split-Path $msi -Leaf)`n")
          "sha256=$h" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256 $h"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: installer/bin/Release/DbDelta-${{ steps.ver.outputs.version }}-win-x64.msi

      - name: Attach MSI to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            installer/bin/Release/DbDelta-${{ steps.ver.outputs.version }}-win-x64.msi
            installer/bin/Release/DbDelta-${{ steps.ver.outputs.version }}-win-x64.msi.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
