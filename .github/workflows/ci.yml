name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly compat matrix — 03:17 UTC (off the hour to dodge runner contention).
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  windows-build:
    name: build + non-DB tests (windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run non-DB tests
        run: |
          dotnet test tests/DbDelta.Core.UnitTests --no-build --configuration Release --logger "trx;LogFileName=core.trx"
          dotnet test tests/DbDelta.Architecture.Tests --no-build --configuration Release --logger "trx;LogFileName=arch.trx"
          dotnet test tests/DbDelta.ScriptGen.GoldenTests --no-build --configuration Release --logger "trx;LogFileName=golden.trx"
          dotnet test tests/DbDelta.Persistence.UnitTests --no-build --configuration Release --logger "trx;LogFileName=persistence.trx"
          dotnet test tests/DbDelta.Persistence.IntegrationTests --no-build --configuration Release --logger "trx;LogFileName=dpapi.trx"
          dotnet test tests/DbDelta.App.HeadlessTests --no-build --configuration Release --logger "trx;LogFileName=headless.trx"

      - name: Upload Windows test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: '**/TestResults/*.trx'

  linux-integration-tests:
    name: integration tests (linux + testcontainers MSSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build cross-platform test projects (skip App + Architecture)
        run: |
          dotnet build tests/DbDelta.Providers.LiveDb.IntegrationTests/DbDelta.Providers.LiveDb.IntegrationTests.csproj --configuration Release
          dotnet build tests/DbDelta.Cli.AcceptanceTests/DbDelta.Cli.AcceptanceTests.csproj --configuration Release

      - name: Run integration tests (Testcontainers MS SQL)
        run: |
          dotnet test tests/DbDelta.Providers.LiveDb.IntegrationTests/DbDelta.Providers.LiveDb.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=providers.trx"
          dotnet test tests/DbDelta.Cli.AcceptanceTests/DbDelta.Cli.AcceptanceTests.csproj --no-build --configuration Release --logger "trx;LogFileName=cli.trx"

      - name: Upload Linux test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: '**/TestResults/*.trx'

  nightly-compat-matrix:
    name: nightly compat matrix (SQL Server 2017/2019/2022)
    # Scheduled-only — too heavy (multi-version image pulls) for per-PR runs.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build compat matrix project
        run: dotnet build tests/DbDelta.Compat.Tests/DbDelta.Compat.Tests.csproj --configuration Release

      - name: Run compat matrix (Testcontainers MS SQL 2017/2019/2022)
        env:
          DBDELTA_COMPAT: '1'
        run: dotnet test tests/DbDelta.Compat.Tests/DbDelta.Compat.Tests.csproj --no-build --configuration Release --logger "trx;LogFileName=compat.trx"

      - name: Upload compat matrix results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-matrix-results
          path: '**/TestResults/*.trx'
